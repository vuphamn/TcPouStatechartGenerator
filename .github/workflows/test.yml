name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows: the tests run the app in Edge (installed on the runner), as users do
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The desktop suite is not run here: no Electron binary needed
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # (the whole history and its tags: the release notes are built from them)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gateway's own dependencies (the live suite starts it)
      - run: npm ci --prefix gateway
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: node tests/run.cjs unit
      # The XAE extension's code that needs no Visual Studio (the PLC project files it sends the app)
      - name: XAE extension tests (C#)
        run: dotnet test xae-extension/KvalMachineScope.Xae.Tests
      # The web app the gateway serves (dist/): the live suite's board and setup pages open it in a browser
      - name: Build
        run: npm run build
      - name: Live view protocol tests (simulated PLC)
        run: node tests/run.cjs live
      # The failed tests and their checks on the run's page (the screenshots: in the artifact below)
      - name: Test summary
        if: always()
        run: node scripts/test-summary.cjs "Tests" >> "$env:GITHUB_STEP_SUMMARY"
      - name: Test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: tests/.output
          # (a folder starting with a dot: skipped unless asked for)
          include-hidden-files: true
          retention-days: 7

  web:
    # The web app in headless Edge, in two jobs side by side (every other test each)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # (the whole history and its tags: the release notes are built from them)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix gateway
      # The built app, served by vite preview: pages load at once (the dev server compiles each module on first use,
      # which a slow runner does not keep up with)
      - name: Build
        run: npm run build
      # (--retry: a test failed on the slow runner is run once more; passing then, it is listed as flaky in the log)
      - name: Web app tests (headless Edge)
        run: node tests/run.cjs web --preview --retry --shard ${{ matrix.shard }}/2
      - name: Test summary
        if: always()
        run: node scripts/test-summary.cjs "Web tests (${{ matrix.shard }}/2)" >> "$env:GITHUB_STEP_SUMMARY"
      - name: Test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-web-${{ matrix.shard }}
          path: tests/.output
          include-hidden-files: true
          retention-days: 7

  vscode:
    # The VS Code extension in VS Code itself: a portable VS Code (the zip) on the runner, the extension loaded from its
    # sources with a profile of its own; Structured Text sections, Build's messages (XAE's stand-in), live values (a
    # stand-in PLC), Rename, the outline, the checks and IntelliSense
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: VS Code (portable)
        run: |
          Invoke-WebRequest -Uri 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile vscode.zip
          Expand-Archive vscode.zip -DestinationPath "$env:RUNNER_TEMP\vscode"
          "KSS_VSCODE=$env:RUNNER_TEMP\vscode\Code.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: VS Code extension tests
        run: node tests/run.cjs vscode
      - name: Test summary
        if: always()
        run: node scripts/test-summary.cjs "VS Code extension" >> "$env:GITHUB_STEP_SUMMARY"
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-vscode
          path: tests/.output
          include-hidden-files: true
          retention-days: 7

  desktop:
    # The Electron app (its window on the runner's desktop, driven over its debugging port) against the dev server
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # (the whole history and its tags: the release notes are built from them)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # With the Electron binary this time
      - run: npm ci
      - run: npm ci --prefix gateway
      # npm ci may leave Electron's download out (its install script): fetched here if missing, and checked
      - name: The Electron binary
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { node node_modules/electron/install.js }
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { Write-Error 'No Electron binary'; exit 1 }
          node -e "console.log(require('electron'))"
      - name: Build
        run: npm run build
      # The runner's screen is 1024x768: the app's 1280x850 window would be squeezed below its wide layout
      - name: Screen 1920x1080
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Warning "Screen size not set: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Desktop app tests (Electron)
        run: node tests/run.cjs desktop --preview
      - name: Test summary
        if: always()
        run: node scripts/test-summary.cjs "Desktop tests" >> "$env:GITHUB_STEP_SUMMARY"
      - name: Test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-desktop
          path: tests/.output
          include-hidden-files: true
          retention-days: 7
